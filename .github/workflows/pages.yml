# The page (web/) on GitHub Pages: https://enkerli.github.io/mvane-yard/ (Web MIDI needs HTTPS)
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: The page only (no tests, no local emulator)
        run: |
          mkdir site
          cp -R web/index.html web/take.js web/ysb.js web/zip.js web/scale_names.json web/clp_names.json web/fm1ports.js web/lib site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
