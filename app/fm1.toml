# mvane yard: custom FM-1 firmware (tools: base/tools/build.py app)
name = "MVANE-YARD"
id_prefix = "FM-1_17"          # package identity: dev FM-1_1700, releases FM-1_17XXYYZZ (unclaimed as far as known)
usb_manufacturer = "mvane yard"
usb_product = "MVANE YARD FM-1"
usb_serial = true
include = ["../core", "clipper", "clipper/src", "clipper/gen", "clipper/hal"]   # the portable core; Clipper's synth (app/clipper)
o2 = ["synth.c", "clipper/clp.c"]   # mvane yard's synth and Clipper's, each its own unit at -O2
o2_cflags = ["-Os"]            # Clipper is built at -Os, as Clipper builds it (fewer 64-bit multiplies inlined beside loads: felucca-bsp docs/CPU.md)
vendored = ["clipper/"]        # Clipper's sources as they are: the register check skips them (their tables)
words = "words.tsv"
font_full = ["L", "M"]         # lower case in the big fonts: chord names (Dm9)
ble = false                    # no radio: keeps the build free of JieLi's closed Bluetooth libraries (GPL app)
cpu2 = true                    # the second core: half of Clipper's voices (clp_cores)
cpu2_fallback = true           # one core after a failure of the second, instead of a restart
cpu2_stack = 4096              # its jobs' stack: Clipper's voice renders
usb_host = true                # USB MIDI host on request (GLO + SELECT): a controller with its own power (the Diosynth)
companion = true               # settings and the take as files over USB (base/web/companion, tools/fm1_companion.py)
tagline = "chords from any scale, Clipper's sounds, MPE, and a recorder that keeps everything"
repo = "https://github.com/Enkerli/mvane-yard"
site = "https://enkerli.github.io/mvane-yard/"   # the page: the take as MIDI, settings
install = "https://github.com/Enkerli/mvane-yard/releases"   # the .fwsc, for M-Patcher or fm1-base's installer
screenshot = "docs/media/card.png"     # for the hubs' cards: square, 240 x 240 (fmhub.json's image too)
licence = "GPL-3.0-only"
credits = "Built on fm1-base (MPL-2.0) and felucca-bsp; the sounds are Clipper's synth (GPL-3.0, by 3dSam and contributors, after SLOOP and Felucca by Leo Kuroshita)."
author = "Alexandre Enkerli"
description = "A performance firmware for the M-VAVE FM-1. Play notes, or chords from any of eight pitch-class sets (Coral Flower-style qualities or the scale's own types, close, open, wide or paired voicings, a separate bass, smooth voice leading, HOLD), through Clipper's 337 factory sounds or a simple saw, with MPE in and out, breath and mono legato. A recorder that never stops keeps what you played: capture it after the fact, replay it through other sounds, save eight takes, take them to a DAW as MIDI."
tags = ["synth", "chords", "sequencer", "midi"]
